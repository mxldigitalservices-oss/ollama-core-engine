name: Ollama Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ollama-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTAINER_NAME: ollama-server
      CUSTOM_MODEL: custom-assistant
      HOST_PORT: "11434"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar estructura del repositorio
        run: |
          for f in docker/Dockerfile config/Modelfile scripts/setup.sh README.md; do
            test -f "$f" || { echo "Falta $f"; exit 1; }
          done
          grep -q 'SYSTEM """' config/Modelfile

      - name: Validar sintaxis de setup.sh
        run: bash -n scripts/setup.sh

      - name: Desplegar Ollama y crear modelo
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh --foreground

      - name: Verificar API y modelo registrado
        run: |
          curl -fsS "http://localhost:${HOST_PORT}/api/version"
          curl -fsS "http://localhost:${HOST_PORT}/api/tags" | grep -q "${CUSTOM_MODEL}"

      - name: Prueba de inferencia
        run: |
          curl -fsS --max-time 300 "http://localhost:${HOST_PORT}/api/generate" \
            -d "{\"model\":\"${CUSTOM_MODEL}\",\"prompt\":\"Responde solo con la palabra OK\",\"stream\":false,\"options\":{\"num_predict\":16}}" \
            | tee response.json
          grep -q '"response"' response.json

      - name: Logs del contenedor
        if: always()
        run: docker logs "${CONTAINER_NAME}" || true

      - name: Limpieza
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true
